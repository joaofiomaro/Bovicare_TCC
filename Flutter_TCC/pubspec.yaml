name: bovicare
description: BoviCare — Gestão de rebanho bovino para produtores e veterinários.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # --- State Management & DI ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Navegação ---
  go_router: ^15.1.2

  # --- Firebase ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # --- Persistência Local ---
  shared_preferences: ^2.5.3

  # --- IoT (Brete — reservado para a Fase 7, ainda não implementada) ---
  mqtt_client: ^10.7.0

  # --- UI & Animações ---
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  material_symbols_icons: ^4.2787.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # --- Mapas & Localização ---
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.4

  # --- Formulários & Validação ---
  formz: ^0.8.0

  # --- Utilitários ---
  intl: ^0.20.2
  logger: ^2.5.0
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  equatable: ^2.0.7

  # --- Code Gen (runtime) ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Qualidade & Linting ---
  very_good_analysis: ^7.0.0

  # --- Code Generation ---
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.3

  # --- Testes ---
  mocktail: ^1.0.5

  # --- Ícone & Splash nativos (geração) ---
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - .env

# Ícone do app (gera ícones nativos a partir da marca).
# Rodar: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1C6B3A"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"

# Splash screen nativo (logo centralizado sobre fundo branco).
# Rodar: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/bovicare_logo.png"
  android_12:
    image: "assets/icon/app_icon_foreground.png"
    color: "#FFFFFF"
  web: false
