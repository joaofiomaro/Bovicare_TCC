; =====================================================================
;  BoviCare - Firmware do brete (PlatformIO)
;  Quem usa o Arduino IDE pode ignorar este arquivo e abrir
;  BoviCare_Brete/BoviCare_Brete.ino diretamente.
; =====================================================================
[platformio]
src_dir = BoviCare_Brete
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
; Bluetooth ocupa bastante memoria de programa: particao com 3 MB de app.
board_build.partitions = huge_app.csv
; 1.4.12 ou mais nova: a 1.4.11 nao compila com o GCC 14 do core ESP32 3.x
lib_deps =
    miguelbalboa/MFRC522@^1.4.12
build_flags = -Wall
